name: Publicar Release (APK)

on:
  push:
    tags:
      - 'v*' # Se dispara solo cuando subes una etiqueta como v1.0.0

permissions:
  contents: write # Necesario para crear el Release y subir el archivo

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar libreria Sherpa-ONNX AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/sherpa-onnx-2.0.3.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar

      - name: Descargar modelo de voz Sherpa-ONNX
        run: |
          mkdir -p app/src/main/assets/tts-model
          curl -L -o vits-model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2
          tar -xjf vits-model.tar.bz2
          cp -r vits-piper-es_ES-davefx-medium/* app/src/main/assets/tts-model/
          rm -rf vits-model.tar.bz2 vits-piper-es_ES-davefx-medium

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Crear Release y adjuntar APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk